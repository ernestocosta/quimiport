# Blueprint do Render: cria banco + API + painel a partir deste repositório.
# Render → New → Blueprint → selecione o repositório.
databases:
  - name: quimiport-db
    plan: free
    databaseName: quimiport
    user: quimiport
    postgresMajorVersion: "16"

services:
  - type: web
    name: quimiport-api
    runtime: docker
    plan: free
    dockerContext: ./api
    dockerfilePath: ./api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quimiport-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGIN
        value: "*"
      - key: SEED_ON_START
        value: "true"

  - type: web
    name: quimiport-web
    runtime: docker
    plan: free
    dockerContext: ./web
    dockerfilePath: ./web/Dockerfile
    envVars:
      # URL pública da API (ex.: https://quimiport-api.onrender.com).
      # O Render repassa como build arg para o Dockerfile.
      - key: VITE_API_URL
        sync: false
