name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, build e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quimiport
          POSTGRES_PASSWORD: quimiport
          POSTGRES_DB: quimiport_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quimiport"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://quimiport:quimiport@localhost:5432/quimiport_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificação de tipos
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Migrations em sincronia com o schema
        run: npx drizzle-kit check

      - name: Testes (unitários + integração com PostgreSQL)
        run: npm run test:coverage

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-api
          path: api/coverage
          retention-days: 7

  web:
    name: Painel web — lint e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificação de tipos
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Docker — build e smoke test
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Build das imagens
        run: docker compose build

      - name: Subir banco + API e aguardar healthcheck
        run: docker compose up -d --wait db api

      - name: Smoke test da API
        run: |
          curl -fsS http://localhost:3333/health
          curl -fsS "http://localhost:3333/produtos-quimicos?limite=1"
          curl -fsS http://localhost:3333/docs/openapi.json > /dev/null

      - name: Logs da API (em caso de falha)
        if: failure()
        run: docker compose logs api

      - name: Derrubar ambiente
        if: always()
        run: docker compose down -v
